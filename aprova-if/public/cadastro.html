<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cadastro - Aprova IF</title>
  <link rel="stylesheet" href="/css/reset.css" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/components/buttons.css" />
  <link rel="stylesheet" href="/css/components/forms.css" />
  <link rel="stylesheet" href="/css/pages/cadastro.css" />
</head>
<body>
  <main class="auth-page">
    <section class="auth-card" aria-labelledby="tituloCadastro">
      <h1 id="tituloCadastro">Criar conta</h1>
      <p>Comece sua preparação agora.</p>
      <form id="cadastroForm" novalidate>
        <div class="form-group">
          <label for="nome">Nome</label>
          <input id="nome" name="nome" type="text" placeholder="Seu nome" autocomplete="name" minlength="2" maxlength="100" required />
        </div>
        <div class="form-group">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" placeholder="seu@email.com" autocomplete="email" maxlength="254" required />
        </div>
        <div class="form-group">
          <label for="senha">Senha</label>
          <input id="senha" name="senha" type="password" placeholder="Mínimo de 8 caracteres" autocomplete="new-password" minlength="8" required />
        </div>
        <div class="form-group">
          <label for="confirmarSenha">Confirmar senha</label>
          <input id="confirmarSenha" name="confirmarSenha" type="password" placeholder="Digite a senha novamente" autocomplete="new-password" minlength="8" required />
        </div>
        <p id="mensagem" class="auth-message" role="status" aria-live="polite"></p>
        <button id="btnCadastro" type="submit" class="btn btn-primary btn-full">Criar conta</button>
      </form>
      <div class="auth-footer"><span>Já possui conta?</span> <a href="/login">Entrar</a></div>
      <div class="auth-footer"><a href="/">Voltar ao início</a></div>
    </section>
  </main>
  <script src="/js/cadastro.js" defer></script>
</body>
</html>
